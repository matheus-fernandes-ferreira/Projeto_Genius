<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Genius 2.0: observe a sequência e repita com precisão.">
    <title>Genius 2.0</title>
    <link rel="stylesheet" href="genius-v2.css">
</head>
<body>
    <main class="app">
        <section class="panel" aria-label="Painel do jogo">
            <a class="back-link" href="index.html">← Versão clássica</a>
            <h1>Genius <span>2.0</span></h1>
            <p class="sub">Observe a sequência e repita com precisão.</p>
            <div class="stats">
                <div class="stat"><span>Pontuação</span><b id="score">0</b></div>
                <div class="stat"><span>Rodada</span><b id="round">0</b></div>
                <div class="stat wide"><span>Recorde</span><b id="best">0</b></div>
            </div>
            <div class="actions">
                <button class="btn primary" id="start" type="button">▶ Iniciar jogo</button>
                <button class="btn" id="reset" type="button">↻ Reiniciar</button>
            </div>
            <p class="hint">Teclado: <kbd>Q</kbd> <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> ou <kbd>1</kbd>–<kbd>4</kbd>. Cada cor tem um som próprio.</p>
        </section>

        <section class="stage">
            <div class="board lock" id="board" role="group" aria-label="Tabuleiro com quatro cores">
                <button class="pad" data-i="0" type="button" aria-label="Verde"><i>Q</i></button>
                <button class="pad" data-i="1" type="button" aria-label="Amarelo"><i>W</i></button>
                <button class="pad" data-i="2" type="button" aria-label="Vermelho"><i>A</i></button>
                <button class="pad" data-i="3" type="button" aria-label="Azul"><i>S</i></button>
                <div class="hub" id="hub" data-s="idle">
                    <small>Rodada</small><strong id="hubRound">0</strong>
                    <p role="status" aria-live="polite"><span class="dot"></span><span id="status">Pronto?</span></p>
                </div>
            </div>
        </section>
    </main>
    <script src="genius-v2.js"></script>
</body>
</html>
