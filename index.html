<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Genius Game</title>
</head>

<body>
    <main class="game-genius">
        <aside id="painel" aria-label="Controles e placar">
            <h1>Genius</h1>
            <div id="placar">
                <div class="score-item">
                    <span class="label-placar">Pontuação</span>
                    <p id="pontos">0</p>
                </div>
                <div class="score-item">
                    <span class="label-placar">Rodada</span>
                    <p id="rodada">0</p>
                </div>
            </div>

            <div class="btn-start-reset">
                <button type="button" id="start">Iniciar jogo</button>
                <button type="button" id="reset">Reiniciar</button>
                <a class="v2-link" href="genius-v2.html">Experimentar versão 2.0</a>
            </div>
        </aside>

        <section id="conteudo" aria-label="Tabuleiro do jogo">
            <div class="container">
                <button type="button" id="btn1" class="button green" aria-label="Botão verde"></button>
                <button type="button" id="btn2" class="button yellow" aria-label="Botão amarelo"></button>
                <button type="button" id="btn3" class="button red" aria-label="Botão vermelho"></button>
                <button type="button" id="btn4" class="button blue" aria-label="Botão azul"></button>
            </div>
        </section>
    </main>

    <script src="projetoGenius.js"></script>
</body>

</html>
